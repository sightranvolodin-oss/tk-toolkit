name: Release

# Raise `version` in tk_toolkit/blender_manifest.toml and push to main: if there is no
# release vX.Y.Z yet, this builds tk_toolkit-X.Y.Z.zip and publishes the release
# (the tag is created by the release). It can also be started by hand from the Actions tab.

on:
  push:
    branches: [main]
    paths: ["tk_toolkit/blender_manifest.toml", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' tk_toolkit/blender_manifest.toml)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V already exists — nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build extension zip
        if: steps.ver.outputs.exists != 'true'
        run: |
          cd tk_toolkit
          zip -r "../tk_toolkit-${{ steps.ver.outputs.version }}.zip" . -x "__pycache__/*" "*.pyc"

      - name: Release notes from CHANGELOG
        if: steps.ver.outputs.exists != 'true'
        run: |
          awk -v v="${{ steps.ver.outputs.version }}" '
            $0 ~ "^## " v { on=1; next }
            /^## / && on { exit }
            on { print }' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "TK Toolkit ${{ steps.ver.outputs.version }}" > notes.md

      - name: Publish release
        if: steps.ver.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            "tk_toolkit-${{ steps.ver.outputs.version }}.zip" \
            --target "$GITHUB_SHA" \
            --title "TK Toolkit ${{ steps.ver.outputs.version }}" --notes-file notes.md
